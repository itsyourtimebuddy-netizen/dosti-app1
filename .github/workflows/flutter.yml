name: Flutter build and test

# Runs by itself on every upload/push, and can also be started by hand:
# Actions tab -> "Flutter build and test" -> Run workflow (you can type your backend URL there).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL baked into the APK (e.g. http://192.168.1.5:3000). Leave empty for the emulator default."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo only holds the Dart code. This creates the Android project around it.
      # Existing files (lib/, test/, pubspec.yaml, debug manifest) are kept.
      - name: Create Android project files
        run: flutter create --org com.dosti --project-name dosti_app --platforms=android .

      # flutter_secure_storage needs minSdk 23. Raise it only if Flutter's default is lower.
      - name: Make sure minSdk is at least 23
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/minSdk(Version)? +flutter\.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 23)/' android/app/build.gradle
          fi
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Install packages
        run: flutter pub get

      # Style hints (info level) do not fail the build; real errors and warnings do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        env:
          API_URL: ${{ github.event.inputs.api_base_url || 'http://10.0.2.2:3000' }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_URL"

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: dosti-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
